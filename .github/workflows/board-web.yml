name: Board web

on:
  push:
    branches: [main]
    paths:
      - "board/web/**"
      - ".github/workflows/board-web.yml"
  pull_request:
    paths:
      - "board/web/**"
      - ".github/workflows/board-web.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: board/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: board/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
