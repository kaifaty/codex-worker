name: Rotation stress tests

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/stress_rotation.py --repetitions 3 --jobs 4
