[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-worker"
dynamic = ["version"]
description = "Run Codex or Claude work turns in isolated git worktrees, with review, checks and subscription rotation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "kaifaty"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/kaifaty/codex-worker"

[project.scripts]
codex-worker = "codex_worker.__main__:cli.main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["codex_worker"]

[tool.setuptools.dynamic]
version = {attr = "codex_worker.__version__"}

[tool.setuptools.package-data]
codex_worker = ["rules*.md", "docs/*.md"]
