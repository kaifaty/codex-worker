[project]
name = "codex-worker-board"
version = "0.1.0"
description = "Read-only local task board for codex-worker"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
codex-worker-board = "codex_worker_board.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
