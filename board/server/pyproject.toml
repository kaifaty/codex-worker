[project]
name = "teamster-board"
version = "0.1.0"
description = "Read-only local task board for teamster"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
teamster-board = "teamster_board.__main__:main"
codex-worker-board = "teamster_board.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
