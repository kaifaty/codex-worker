[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "teamster"
dynamic = ["version"]
description = "Run Codex or Claude work turns in isolated git worktrees, with review, checks and subscription rotation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "kaifaty"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/kaifaty/teamster"

[project.scripts]
teamster = "teamster.__main__:cli.main"
codex-worker = "teamster.__main__:cli.main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["teamster"]

[tool.setuptools.dynamic]
version = {attr = "teamster.__version__"}

[tool.setuptools.package-data]
teamster = ["rules*.md", "docs/*.md"]
